version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: confesiones_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confesiones_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-confesiones_db}
    volumes:
      - confesiones_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-confesiones_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: confesiones_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      CANAL_ID: ${CANAL_ID}
      GRUPO_ADMIN_ID: ${GRUPO_ADMIN_ID}
      CANAL_OBLIGATORIO: ${CANAL_OBLIGATORIO}
      CANAL_OPCIONAL: ${CANAL_OPCIONAL}
      OWNER_ID: ${OWNER_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-confesiones_secret_2026}@postgres:5432/${POSTGRES_DB:-confesiones_db}

volumes:
  confesiones_postgres_data:
